apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-config
  namespace: odoo
data:
  odoo.conf: |
    [options]
    addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    data_dir = /var/lib/odoo
    db_host = postgres
    db_port = 5432
    db_user = odoo
    db_name = odoo
    dbfilter = ^odoo$
    list_db = False
    proxy_mode = True
    workers = 2
    max_cron_threads = 1
    limit_time_cpu = 600
    limit_time_real = 1200
    limit_memory_soft = 1073741824
    limit_memory_hard = 1342177280
