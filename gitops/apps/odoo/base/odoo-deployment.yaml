apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data
  namespace: odoo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: auto-ebs-sc
  resources:
    requests:
      storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: odoo
  namespace: odoo
spec:
  minAvailable: 0        # single-replica test tier; see Section 13
  selector:
    matchLabels:
      app: odoo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo
spec:
  replicas: 1
  strategy:
    type: Recreate       # RWO volume — the old pod must release it first
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
    spec:
      # Long enough for an in-flight report or import to finish before eviction.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: odoo
          image: odoo-app          # replaced by kustomize with the ECR digest
          args: ["odoo", "-c", "/etc/odoo/odoo.conf"]
          env:
            - name: PASSWORD       # official entrypoint maps this to --db_password
              valueFrom:
                secretKeyRef:
                  name: odoo-db
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits:   { memory: 3Gi }
          startupProbe:
            httpGet: { path: /web/health, port: 8069 }
            periodSeconds: 10
            failureThreshold: 60      # allow up to 10 min for first boot
          readinessProbe:
            httpGet: { path: /web/health, port: 8069 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /web/health, port: 8069 }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
            - name: data
              mountPath: /var/lib/odoo
      volumes:
        - name: config
          configMap:
            name: odoo-config
        - name: data
          persistentVolumeClaim:
            claimName: odoo-data
