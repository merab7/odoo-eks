apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-upgrade
  namespace: odoo
  annotations:
    # A *Sync*-phase hook, not PreSync: PreSync runs before anything else exists, so the
    # PVC, ConfigMap, Secret and Postgres this Job needs would be missing on a fresh
    # install and the sync would deadlock. Sync hooks honour sync waves, so wave 1 still
    # places this after postgres (wave 0) and before the serving Deployment (wave 2).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # A Job's spec is immutable, so it cannot be updated in place — Replace=true fails
    # with "spec.selector: Required value". Deleting the previous Job before creating the
    # new one is the only way to re-run a migration when the image digest changes.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0        # a failed migration must not silently retry
  template:
    spec:
      restartPolicy: Never
      # `odoo-data` is a ReadWriteOnce EBS volume. On an update the previous Odoo pod is
      # still running and holds it, so a Job scheduled onto a different node fails with
      # "Multi-Attach error". Two nodes can never share an RWO volume; one node can.
      # Prefer — not require — the Odoo node, so a first install (where no Odoo pod exists
      # yet, because the Deployment is wave 2) can still schedule anywhere.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: odoo
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: upgrade
          image: odoo-app         # same digest as the Deployment
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              MODULES="base,hello_odoo"
              LOG=/tmp/upgrade.log

              echo "=== odoo -i/-u ${MODULES} ==="
              # -i installs anything missing, -u updates what is already installed.
              # Running only -u would silently no-op on a module that was never installed.
              # This Job overrides `command`, which replaces the image entrypoint — so the
              # entrypoint script that normally maps $PASSWORD to --db_password never runs.
              # Pass it explicitly or psycopg2 fails with "fe_sendauth: no password supplied".
              odoo -c /etc/odoo/odoo.conf \
                   -d odoo \
                   --db_password="${PASSWORD}" \
                   -i "${MODULES}" \
                   -u "${MODULES}" \
                   --stop-after-init \
                   --no-http \
                   --max-cron-threads=0 2>&1 | tee "${LOG}"

              echo "=== asserting on the log, not the exit code ==="
              # Odoo exits 0 on plenty of things that are not success.
              # Match only Odoo's own log records at ERROR/CRITICAL level:
              #   2026-08-26 18:44:10,976 8 ERROR odoo odoo.modules.loading: ...
              # A bare word-match on ERROR also catches docutils noise such as
              #   <string>:38: (ERROR/3) Unexpected indentation.
              # emitted while rendering a module's reStructuredText description — harmless,
              # but enough to fail an otherwise successful migration.
              ODOO_ERR='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:,]+ [0-9]+ (CRITICAL|ERROR) '
              if grep -qE "${ODOO_ERR}" "${LOG}"; then
                echo "FAIL: errors present in update log"
                grep -nE "${ODOO_ERR}" "${LOG}" | head -50
                exit 1
              fi
              if ! grep -q 'Modules loaded' "${LOG}"; then
                echo "FAIL: 'Modules loaded' never appeared — registry did not finish"
                exit 1
              fi
              echo "OK"
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db
                  key: POSTGRES_PASSWORD
          resources:
            # Deliberately smaller than the Deployment's request so the Job can fit beside
            # a running Odoo pod on one node — co-location is what avoids the Multi-Attach
            # failure above. A migration is short-lived and single-threaded.
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { memory: 2Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/odoo
            - name: data
              mountPath: /var/lib/odoo
      volumes:
        - name: config
          configMap:
            name: odoo-config
        - name: data
          persistentVolumeClaim:
            claimName: odoo-data
